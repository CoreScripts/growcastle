<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Grow Castle - Tower Defense</title>
  
  <link rel="stylesheet" href="TemplateData/style.css">
  
  <script>
    window.unityInstance = null;
  </script>
  <script>
  (function () {
    // This function checks every 100ms if Unity is ready, then unlocks it
    function waitForUnity(cb) {
      const t = setInterval(() => {
        if (window.unityInstance && window.unityInstance.SendMessage) {
          clearInterval(t);
          cb();
        }
      }, 100);
    }
    
    // Always force the game to bypass site verification on GitHub Pages
    waitForUnity(() => {
      unityInstance.SendMessage('H5MadKidGames', 'H5_OnDomainApproved');
    });
  })();
  </script>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const buildUrl = "Build";
    
    // Using the simplified, clean filenames we created
    const loaderUrl = buildUrl + "/game.loader.js";

    const config = {
      dataUrl: buildUrl + "/game.data",
      frameworkUrl: buildUrl + "/game.framework.js",
      codeUrl: buildUrl + "/game.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "madkidgames.com",
      productName: "Grow Castle - Tower Defense",
      productVersion: "1.11.4",
    };

    // Dynamically inject the loader script into the browser page
    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // Handled by style.css loading layout
      }).then((instance) => {
        window.unityInstance = instance;
      }).catch((message) => {
        alert("Unity Load Error: " + message);
      });
    };
    document.body.appendChild(script);
  </script>

  <script>
  (function () {
    function resizeUnityCanvas() {
      const canvas = document.getElementById('unity-canvas');
      if (!canvas) return;
      const targetAspect = 16 / 9;
      let newWidth = window.innerWidth;
      let newHeight = window.innerWidth / targetAspect;
      if (newHeight > window.innerHeight) {
        newHeight = window.innerHeight;
        newWidth = newHeight * targetAspect;
      }
      canvas.style.width = newWidth + 'px';
      canvas.style.height = newHeight + 'px';
    }
    window.addEventListener('load', resizeUnityCanvas);
    window.addEventListener('resize', resizeUnityCanvas);
  })();
  </script>
</body>
</html>
